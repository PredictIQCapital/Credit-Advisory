[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-readiness"
version = "0.3.0"
description = "Rules-and-ratios credit readiness diagnostic for German/Austrian SMEs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ai = ["anthropic>=1.0"]
pdf = ["pymupdf>=1.24"]

[project.scripts]
credit-readiness = "credit_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_readiness = ["webapp/static/*", "reference/*.json"]

[tool.vercel]
entrypoint = "api.index:handler"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
